<svg xmlns="http://www.w3.org/2000/svg" viewBox="500 500 1048 1048" width="100%" height="100%" fill="currentColor">
  <!-- Светлые грани (100% непрозрачности текущего цвета) -->
  <g fill-opacity="1">
    <!-- Верхний центральный ромб -->
    <polygon points="1024,502 953,728 1024,868 1095,728" />
    <!-- Внешняя левая грань ножки -->
    <polygon points="875,603 533,1382 690,1333 746,1207 953,728" />
    <!-- Внешняя правая грань ножки -->
    <polygon points="1173,603 1095,728 1302,1207 1358,1333 1515,1382" />
    <!-- Верхняя грань перекладины -->
    <polygon points="923,1101 746,1207 1302,1207 1125,1101" />
  </g>

  <!-- Полутеневые грани (82% непрозрачности текущего цвета) -->
  <g fill-opacity="0.82">
    <!-- Верхние боковые плечи -->
    <polygon points="1024,502 875,603 953,728" />
    <polygon points="1024,502 1095,728 1173,603" />
    <!-- Внутренние верхние грани ножек -->
    <polygon points="953,728 746,1207 923,1101 1024,868" />
    <polygon points="1095,728 1024,868 1125,1101 1302,1207" />
    <!-- Нижние средние грани левой ножки -->
    <polygon points="746,1207 690,1333 761,1471 833,1310" />
    <polygon points="533,1382 599,1546 690,1333" />
    <!-- Нижние средние грани правой ножки -->
    <polygon points="1302,1207 1215,1310 1287,1471 1358,1333" />
    <polygon points="1515,1382 1358,1333 1449,1546" />
  </g>

  <!-- Теневые грани (65% непрозрачности текущего цвета) -->
  <g fill-opacity="0.65">
    <!-- Нижняя грань перекладины -->
    <polygon points="746,1207 833,1310 1215,1310 1302,1207" />
    <!-- Внутренние нижние скосы ножек -->
    <polygon points="690,1333 599,1546 761,1471" />
    <polygon points="1358,1333 1287,1471 1449,1546" />
  </g>
</svg>